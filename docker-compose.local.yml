# AFFiNE Local Air-Gap Development Setup
# Based on .docker/dev/compose.yml.example but simplified for local use

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres_local
    environment:
      POSTGRES_PASSWORD: affine
      POSTGRES_USER: affine
      POSTGRES_DB: affine
    ports:
      - '5433:5432' # Changed to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: affine_redis_local
    ports:
      - '6380:6379' # Changed to avoid conflict

  # Search indexer - required for Affine
  indexer:
    image: manticoresearch/manticore:10.1.0
    container_name: affine_indexer_local
    ports:
      - '9308:9308'
    volumes:
      - manticoresearch_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1

  # Mail service for local development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: affine_mail_local
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Notes9 Backend - Replace with your custom backend implementation
  # The original AFFiNE backend server was removed due to Enterprise Edition licensing restrictions
  notes9-backend:
    image: alpine:latest
    container_name: notes9_backend_placeholder
    command: >
      sh -c "
        echo '🔧 Notes9 Backend Placeholder Running on http://localhost:3010';
        echo '';
        echo 'The AFFiNE Enterprise Edition backend has been removed due to licensing restrictions.';
        echo 'Please implement your own backend server or use an alternative solution.';
        echo '';
        echo '📋 Backend Requirements:';
        echo '- GraphQL API endpoint';
        echo '- User authentication';
        echo '- Document storage & sync';
        echo '- File/blob storage';
        echo '';
        echo '🔧 Implementation Options:';
        echo '1. Build custom Node.js/Express GraphQL server';
        echo '2. Use Supabase/Firebase as backend';
        echo '3. Implement headless CMS solution';
        echo '4. Create minimal API server for your needs';
        echo '';
        while true; do sleep 3600; done
      "
    ports:
      - '3010:3010'
    environment:
      - BACKEND_TYPE=placeholder

  # Frontend Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: affine_web_local
    ports:
      - '8080:8080'
    depends_on:
      - notes9-backend
    restart: unless-stopped

  # AI API Placeholder - replace with your notes9-api
  ai-api:
    image: alpine:latest
    container_name: affine_ai_placeholder
    command: >
      sh -c "
        echo '🤖 AI API Placeholder Running on http://localhost:8001';
        echo '📚 Literature Intelligence Assistant - Ready';
        echo '📝 Smart Notebook & Data Handling - Ready';
        echo '⏰ Scheduling & Timers - Ready';
        echo '🧪 Smart LIMS with Shopping Assistant - Ready';
        echo '';
        echo 'Replace this service with your notes9-api container';
        echo 'Update the build context to: ../agno-notes9-api';
        while true; do sleep 3600; done
      "
    ports:
      - '8001:8001'
    environment:
      - AI_SERVICE=placeholder

volumes:
  postgres_data:
  manticoresearch_data:
