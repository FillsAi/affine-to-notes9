# AFFiNE Local Air-Gap Development Setup
# Based on .docker/dev/compose.yml.example but simplified for local use

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres_local
    environment:
      POSTGRES_PASSWORD: affine
      POSTGRES_USER: affine
      POSTGRES_DB: affine
    ports:
      - '5433:5432' # Changed to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: affine_redis_local
    ports:
      - '6380:6379' # Changed to avoid conflict

  # Search indexer - required for Affine
  indexer:
    image: manticoresearch/manticore:10.1.0
    container_name: affine_indexer_local
    ports:
      - '9308:9308'
    volumes:
      - manticoresearch_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1

  # Mail service for local development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: affine_mail_local
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Backend server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: affine_backend_local
    ports:
      - '3010:3010'
    depends_on:
      - postgres
      - redis
      - indexer
    env_file:
      - docker.env
    environment:
      # Database connections
      - DATABASE_URL=postgresql://affine:affine@postgres:5432/affine
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
      - POSTGRES_DB=affine
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEARCH_ENDPOINT=http://indexer:9308

      # Auth0 configuration
      - OAUTH_OIDC_CLIENT_ID=9SudQjzGEx0S2CVZGFQdE5mVDCZYcrP4
      - OAUTH_OIDC_CLIENT_SECRET=vG9uNqL-0Iq5U5tR9eaw578DAC9IsryQbs9LUdvXEDcDLrDnvciVQ0fVisK4JxqM
      - OAUTH_OIDC_ISSUER=https://fills.us.auth0.com/
      - OAUTH_OIDC_SCOPE=openid profile email
      - OAUTH_OIDC_CLAIM_ID=sub
      - OAUTH_OIDC_CLAIM_EMAIL=email
      - OAUTH_OIDC_CLAIM_NAME=name

      # Mail configuration
      - MAILER_HOST=mailhog
      - MAILER_PORT=1025

      # AWS S3 storage configuration (uses environment variables)
      - AFFINE_STORAGES_AVATAR_STORAGE={"provider":"aws-s3","bucket":"notes9-avatars","config":{"accessKeyId":"${AWS_ACCESS_KEY_ID}","secretAccessKey":"${AWS_SECRET_ACCESS_KEY}","region":"us-east-1"}}
      - AFFINE_STORAGES_BLOB_STORAGE={"provider":"aws-s3","bucket":"notes9-blobs","config":{"accessKeyId":"${AWS_ACCESS_KEY_ID}","secretAccessKey":"${AWS_SECRET_ACCESS_KEY}","region":"us-east-1"}}
      - AFFINE_COPILOT_STORAGE={"provider":"aws-s3","bucket":"notes9-copilot","config":{"accessKeyId":"${AWS_ACCESS_KEY_ID}","secretAccessKey":"${AWS_SECRET_ACCESS_KEY}","region":"us-east-1"}}

      # Other configuration
      - NODE_ENV=development
      - AFFINE_ENV=dev
      - AFFINE_SERVER_EXTERNAL_URL=http://localhost:3010
      - DEBUG=affine:*
      - FORCE_COLOR=true
      - DEBUG_COLORS=true
      - DEPLOYMENT_TYPE=selfhosted
      - AFFINE_CLIENT_VERSIONCONTROL_ENABLED=false
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/packages/backend/native/target
    restart: unless-stopped

  # Frontend Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: affine_web_local
    ports:
      - '8080:8080'
    depends_on:
      - backend
    restart: unless-stopped

  # AI API Placeholder - replace with your notes9-api
  ai-api:
    image: alpine:latest
    container_name: affine_ai_placeholder
    command: >
      sh -c "
        echo '🤖 AI API Placeholder Running on http://localhost:8001';
        echo '📚 Literature Intelligence Assistant - Ready';
        echo '📝 Smart Notebook & Data Handling - Ready';
        echo '⏰ Scheduling & Timers - Ready';
        echo '🧪 Smart LIMS with Shopping Assistant - Ready';
        echo '';
        echo 'Replace this service with your notes9-api container';
        echo 'Update the build context to: ../agno-notes9-api';
        while true; do sleep 3600; done
      "
    ports:
      - '8001:8001'
    environment:
      - AI_SERVICE=placeholder

volumes:
  postgres_data:
  manticoresearch_data:
